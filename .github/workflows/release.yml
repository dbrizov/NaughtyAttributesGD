name: Release

on:
  push:
    branches: [rc]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ADDON_DIR: addons/naughtyattributes

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p na_core
      - name: Tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            targets: x86_64-pc-windows-msvc
            artifact: naughtyattributes.windows.x86_64.dll
          - os: ubuntu-22.04
            name: linux
            targets: x86_64-unknown-linux-gnu
            artifact: naughtyattributes.linux.x86_64.so
          - os: macos-latest
            name: macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: naughtyattributes.macos.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build
        shell: bash
        run: |
          IFS=',' read -ra targets <<< "${{ matrix.targets }}"
          for target in "${targets[@]}"; do
            cargo build --release -p na --target "$target"
          done

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          case "${{ matrix.name }}" in
            windows)
              cp target/x86_64-pc-windows-msvc/release/naughtyattributes.dll "out/${{ matrix.artifact }}"
              ;;
            linux)
              cp target/x86_64-unknown-linux-gnu/release/libnaughtyattributes.so "out/${{ matrix.artifact }}"
              ;;
            macos)
              lipo -create \
                target/aarch64-apple-darwin/release/libnaughtyattributes.dylib \
                target/x86_64-apple-darwin/release/libnaughtyattributes.dylib \
                -output "out/${{ matrix.artifact }}"
              codesign -s - --force "out/${{ matrix.artifact }}"
              lipo -info "out/${{ matrix.artifact }}"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: out/${{ matrix.artifact }}
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: bin

      - name: Assemble
        run: |
          mkdir -p "payload/$ADDON_DIR/bin"
          cp packaging/naughtyattributes.gdextension "payload/$ADDON_DIR/"
          cp demo/addons/naughtyattributes/naughtyattributes.gdextension.uid "payload/$ADDON_DIR/"
          cp packaging/README.md "payload/$ADDON_DIR/"
          cp LICENSE "payload/$ADDON_DIR/"
          cp bin/* "payload/$ADDON_DIR/bin/"

      - name: Verify payload
        run: |
          for f in naughtyattributes.windows.x86_64.dll \
                   naughtyattributes.linux.x86_64.so \
                   naughtyattributes.macos.dylib; do
            test -s "payload/$ADDON_DIR/bin/$f" || { echo "missing $f"; exit 1; }
          done
          find payload -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: naughtyattributes-addon
          path: payload/
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: naughtyattributes-addon
          path: ${{ runner.temp }}/payload

      - name: Append to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin +refs/heads/release:refs/remotes/origin/release
          git switch -c release origin/release
          git rm -rqf . --ignore-unmatch
          cp -r "$RUNNER_TEMP/payload/." .
          git add -A
          git commit --allow-empty -m "Release $GITHUB_REF_NAME"
          git tag "release/$GITHUB_REF_NAME"
          git push origin release "release/$GITHUB_REF_NAME"

      - name: Zip
        run: |
          cd "$RUNNER_TEMP/payload"
          zip -r "$RUNNER_TEMP/naughtyattributes-$GITHUB_REF_NAME.zip" addons

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/naughtyattributes-$GITHUB_REF_NAME.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
