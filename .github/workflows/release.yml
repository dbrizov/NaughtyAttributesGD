name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ADDON_DIR: addons/naughtyattributes

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches workspace version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi

      - name: Find the RC run for this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id=$(gh run list --workflow rc.yml --branch rc --status success \
            --json databaseId,headSha --limit 50 \
            --jq "[.[] | select(.headSha == \"$GITHUB_SHA\")][0].databaseId")
          if [ -z "$run_id" ]; then
            echo "no successful RC run for $GITHUB_SHA"
            echo "push master:rc and let it go green, or re-run RC on the same commit:"
            echo "  gh workflow run rc.yml --ref rc"
            exit 1
          fi
          echo "reusing the addon built by RC run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: naughtyattributes-addon
          path: ${{ runner.temp }}/payload
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify payload
        run: |
          cd "$RUNNER_TEMP/payload"
          for f in bin/naughtyattributes.windows.x86_64.dll \
                   bin/naughtyattributes.linux.x86_64.so \
                   bin/naughtyattributes.macos.dylib \
                   naughtyattributes.gdextension; do
            test -s "$ADDON_DIR/$f" || { echo "missing $f"; exit 1; }
          done
          find . -type f | sort

      - name: Append to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin +refs/heads/release:refs/remotes/origin/release
          git switch -c release origin/release
          git rm -rqf . --ignore-unmatch
          cp -r "$RUNNER_TEMP/payload/." .
          git add -A
          git commit --allow-empty -m "Release $GITHUB_REF_NAME"
          git tag "release/$GITHUB_REF_NAME"
          git push origin release "release/$GITHUB_REF_NAME"

      - name: Zip
        run: |
          cd "$RUNNER_TEMP/payload"
          zip -r "$RUNNER_TEMP/naughtyattributes-$GITHUB_REF_NAME.zip" addons

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/naughtyattributes-$GITHUB_REF_NAME.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
