[workspace]
members = ["na", "na_core", "na_editor", "na_logging"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/dbrizov/NaughtyAttributesGD"

[workspace.dependencies]
godot = { version = "0.5.5", features = ["api-4-6"] }
na_core = { path = "na_core" }
na_editor = { path = "na_editor" }
na_logging = { path = "na_logging" }
